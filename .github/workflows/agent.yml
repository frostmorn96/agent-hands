name: agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to build"
        required: true
        type: string
      model:
        description: "Model name"
        required: false
        default: "qwen"
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/fix'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve task
        id: task
        env:
          COMMENT: ${{ github.event.comment.body }}
          INPUT_TASK: ${{ inputs.task }}
          INPUT_MODEL: ${{ inputs.model }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="$INPUT_TASK"
            MODEL="${INPUT_MODEL:-qwen}"
          else
            TASK="${COMMENT#/fix }"
            MODEL="qwen"
          fi
          {
            echo "task<<__EOF__"
            echo "$TASK"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Building: $TASK"

      - name: Run agent
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ steps.task.outputs.model }}
          TASK: ${{ steps.task.outputs.task }}
          MAX_STEPS: "50"
          WORKDIR: work
        run: |
          if [ -z "$LLM_BASE_URL" ] || [ -z "$LLM_API_KEY" ]; then
            echo "::error::Set repository secrets LLM_BASE_URL and LLM_API_KEY"
            exit 1
          fi
          python agent.py

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d work ] || [ -z "$(ls -A work 2>/dev/null)" ]; then
            echo "nothing produced"
            exit 0
          fi
          BRANCH="agent/run-${{ github.run_id }}"
          git config user.name "agent"
          git config user.email "agent@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A work
          git commit -m "agent: ${{ steps.task.outputs.task }}"
          git push -u origin "$BRANCH"
          gh pr create --title "agent: ${{ steps.task.outputs.task }}" \
            --body "Built by the agent loop. Review \`work/\`." \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-output
          path: work
          if-no-files-found: ignore
